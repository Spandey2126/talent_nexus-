\"></path><path d=\"M16 5.2a3 3 0 0 1 0 5.8\"></path><path d=\"M18 14.6c2 .6 3 2.6 3 5.4\"></path></svg>\n</div>\n<template data-scif=\"1\" value=\"{{t.isNew}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 4px 10px; border-radius: 999px; background: #FFFFFF; color: #1F3F8F; font-size: 12px; font-weight: 700\">NEW</span></template>\n<template data-scif=\"1\" value=\"{{t.notNew}}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"font-size: 18px; color: rgba(27,36,51,0.5)\">\u2192</span></template>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: {{t.numSize}}; font-weight: 600; color: {{t.numColor}}\">{{t.count}}</span>\n<span style=\"font-size: 16px; font-weight: 600\">{{t.label}}</span>\n<template data-scif=\"1\" value=\"{{t.isNew}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #FFFFFF; font-weight: 600\">1,248 employees \u2192</span></template>\n</div>\n</a>\n</template>\n</div>\n<span style=\"font-size: 12px; color: #5C6779; text-align: center\">Talent Nexus is placed first. Workflow tiles open their worklists with a \u2726 Talent Nexus insight; actions stay in the existing HR systems.</span>\n</main>\n</div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var T = [\n      ['Active Resignation', '41', '#E9A7AC', 'resign'], ['MT Count', '12', '#9DBFD9', 'mt'], ['Pending at Appraiser', '63', '#F2B8A2', 'appraiser'], ['Mainstream Data Review', '14', '#B7C7E8', 'mainstream'], ['Bench 60+ \u00b7 TSC pool', '19', '#E8BF8E', 'bench'],\n      ['Retirement Profile', '6', '#D9C4A8', 'retire'], ['Notes', '128', '#A9D6BE', ''], ['EWS & Connect Tracker', '86', '#E7C36A', ''], ['Workforce Profile', '1,248', '#A8BE86', ''], ['Power BI Reports', 'Open \u2197', '#BFA9E0', '']\n    ];\n    var tiles = T.map(function (t) {\n      return { label: t[0], count: t[1], bg: t[2], border: '1px solid rgba(0,0,0,0.04)', shadow: 'none', href: t[3] ? 'PPLists.dc.html' : (t[0] === 'Notes' || t[0] === 'Workforce Profile' ? 'Connect.dc.html' : '#'), isNew: false, notNew: true, numColor: '#1B2433', textColor: '#1B2433', numSize: '30px',\n        go: function () { if (t[3]) { try { window.sessionStorage.setItem('tnTab', t[3]); } catch (e) {} } } };\n    });\n    tiles.unshift({ go: function () {}, label: 'Summary \u00b7 Insights \u00b7 360', count: 'Talent Nexus', bg: '#1F3F8F', border: '3px solid #F2B705', shadow: '0 10px 24px rgba(31,63,143,0.35)', href: 'Summary.dc.html', isNew: true, notNew: false, numColor: '#FFFFFF', textColor: '#FFFFFF', numSize: '24px' });\n    return { tiles: tiles };\n  }\n}\n"}, "Summary": {"tpl": "\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#1F3F8F}\n</style>\n</helmet>\n<div style=\"width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #1B2433; background: #F3F5F9\">\n\n<header style=\"height: 64px; flex-shrink: 0; background: #1F3F8F; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; color: #FFFFFF\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<span style=\"font-size: 22px; font-weight: 700\">People Partner</span>\n<span style=\"font-size: 16px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.4)\">Talent Nexus</span>\n</div>\n<div style=\"display: flex; flex-direction: column; font-size: 13px; text-align: right\"><span style=\"opacity: 0.85\">Welcome,</span><strong style=\"font-size: 15px\">Anju (People Partner)</strong></div>\n</header>\n\n<div style=\"flex: 1; min-height: 0; padding: 12px 28px 14px; display: flex; flex-direction: column; gap: 12px\">\n\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<a href=\"Main.dc.html\" style=\"font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; min-height: 44px\">\u2190 Back</a>\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700\">Talent Nexus</h1>\n<div role=\"tablist\" aria-label=\"Talent Nexus views\" style=\"display: flex; gap: 6px\">\n<template data-scfor=\"1\" list=\"{{views}}\" as=\"v\" hint-placeholder-count=\"2\"><button type=\"button\" role=\"tab\" aria-selected=\"{{v.on}}\" onClick=\"{{v.pick}}\" style=\"height: 38px; padding: 0 16px; border-radius: 6px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">{{v.l}}</button></template>\n</div>\n<span style=\"font-size: 13px; color: #5C6779\">{{scope}}</span>\n</div>\n<div style=\"display: flex; gap: 10px\">\n<label for=\"tnsearch\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden\">Search employee</label>\n<input id=\"tnsearch\" type=\"search\" placeholder=\"Search employee ID / name for Employee 360\" style=\"width: 320px; height: 40px; border: 1px solid #C5CDD9; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF\">\n<button type=\"button\" style=\"height: 40px; padding: 0 16px; border: none; border-radius: 6px; background: #1F3F8F; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Export</button>\n</div>\n</div>\n\n<!-- Filters -->\n<section aria-label=\"Filters\" style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 10px; padding: 10px 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 14px; align-items: end\">\n<template data-scfor=\"1\" list=\"{{filters}}\" as=\"fl\" hint-placeholder-count=\"5\">\n<label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #3A4556\">{{fl.label}}\n<s \"display: flex; gap: 8px\">\n<template data-scfor=\"1\" list=\"{{attK}}\" as=\"k\" hint-placeholder-count=\"3\"><div style=\"flex: 1; background: {{k.bg}}; border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column\"><span style=\"font-size: 20px; font-weight: 700; color: {{k.fg}}\">{{k.v}}</span><span style=\"font-size: 11px; color: #3A4556\">{{k.l}}</span></div></template>\n</div>\n<div style=\"flex: 1; min-height: 90px; display: flex; align-items: flex-end; gap: 10px; padding: 0 4px; border-bottom: 1px solid #8A96A8\">\n<template data-scfor=\"1\" list=\"{{att}}\" as=\"m\" hint-placeholder-count=\"6\">\n<div style=\"flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px\">\n<span style=\"font-size: 11px; font-weight: 700\">{{m.t}}</span>\n<div style=\"width: 60%; height: {{m.ih}}; background: #7359A8; border-radius: 3px 3px 0 0\"></div>\n<div style=\"width: 60%; height: {{m.vh}}; background: #E8833A\"></div>\n</div>\n</template>\n</div>\n<div style=\"display: flex; gap: 10px; padding: 0 4px\">\n<template data-scfor=\"1\" list=\"{{att}}\" as=\"m\" hint-placeholder-count=\"6\"><span style=\"flex: 1; text-align: center; font-size: 11px; color: #5C6779\">{{m.l}}</span></template>\n</div>\n<span style=\"font-size: 11px; color: #3A4556; line-height: 1.4\">{{attReasons}}</span>\n</section>\n\n<!-- Attention -->\n<section style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n<h2 style=\"margin: 0 0 4px; font-size: 15px; font-weight: 700\">Needs your attention</h2>\n<template data-scfor=\"1\" list=\"{{attention}}\" as=\"a\" hint-placeholder-count=\"6\">\n<a href=\"#\" style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF1F5; text-decoration: none; color: #1B2433\">\n<div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; font-weight: 600\">{{a.t}}</span><span style=\"font-size: 12px; color: #5C6779\">{{a.d}}</span></div>\n<span style=\"min-width: 36px; text-align: center; padding: 3px 8px; border-radius: 999px; background: {{a.bg}}; color: {{a.fg}}; font-size: 13px; font-weight: 700\">{{a.n}}</span>\n</a>\n</template>\n</section>\n</div>\n</div>\n</template>\n<!-- INSIGHTS -->\n<template data-scif=\"1\" value=\"{{isInsights}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.45fr; gap: 12px\">\n<!-- Today's insights -->\n<section style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">\u2726 Today\u2019s insights</h2><span style=\"font-size: 12px; color: #5C6779\">22 Nov 2026 \u00b7 refreshed 9:00 AM</span></div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0\">\n<template data-scfor=\"1\" list=\"{{daily}}\" as=\"d\" hint-placeholder-count=\"9\">\n<div style=\"border: 1px solid #DDE3EC; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start\">\n<span style=\"min-width: 44px; padding: 4px 6px; border-radius: 6px; background: {{d.bg}}; color: {{d.fg}}; font-size: 15px; font-weight: 700; text-align: center\">{{d.n}}</span>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; font-weight: 600\">{{d.t}}</span><span style=\"font-size: 12px; color: #3A4556\">{{d.s}}</span></div>\n</div>\n</template>\n</div>\n</section>\n<!-- Ask -->\n<section style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0\">\n<h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">Ask a question about my employees</h2>\n<div style=\"display: flex; gap: 8px\">\n<label for=\"tnask\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden\">Your question</label>\n<input id=\"tnask\" type=\"text\" value=\"{{ask}}\" onChange=\"{{setAsk}}\" placeholder=\"e.g. How many people were promoted in 2025?\" style=\"flex: 1; height: 42px; border: 1px solid #C5CDD9; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 14px\">\n<button type=\"button\" onClick=\"{{doAsk}}\" style=\"height: 42px; padding: 0 18px; border: none; border-radius: 6px; background: #1F3F8F; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer\">Ask</button>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<template data-scfor=\"1\" list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"10\">\n<button type=\"button\" onClick=\"{{c.pick}}\" aria-pressed=\"{{c.on}}\" style=\"min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer\">{{c.q}}</button>\n</template>\n</div>\n<div style=\"flex: 1; min-height: 0; border-top: 1px solid #EEF1F5; padding-top: 10px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; color: #5C6779\">Q: {{ans.q}}</span>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-size: 34px; font-weight: 700; color: #1F3F8F\">{{ans.n}}</span><span style=\"font-size: 14px; color: #1B2433\">{{ans.unit}}</span></div>\n<span style=\"font-size: 13px; color: #2A3445; line-height: 1.45\">{{ans.text}}</span>\n<template data-scif=\"1\" value=\"{{ans.simple}}\" hint-placeholder-val=\"{{ true }}\">\n<table style=\"width: 100%; border-collapse: collapse; font-size: 13px\">\n<thead><tr style=\"text-align: left; color: #5C6779; background: #F3F5F9\"><th scope=\"col\" style= SI', 0.2]] },\n      pay: { label: 'Payroll', opts: [['All payrolls', 1], ['India', 0.82], ['US', 0.1], ['UK', 0.06], ['South Africa', 0.02]] },\n      per: { label: 'Period', opts: [['FY 2026-27 till date', 1], ['November 2026', 0.14], ['Last quarter', 0.35]] }\n    };\n    var w = function (k) { var o = F[k].opts.filter(function (x) { return x[0] === st[k]; })[0]; return o ? o[1] : 1; };\n    var stock = w('bu') * w('vert') * w('dept') * w('pay');\n    var flow = stock * w('per');\n    var n = function (base, fac) { var v = Math.round(base * fac); return v; };\n    var fmt = function (v) { return v.toLocaleString('en-IN'); };\n    var hc = n(1248, stock);\n    var filters = ['bu', 'vert', 'dept', 'pay', 'per'].map(function (k) {\n      return { label: F[k].label, value: st[k], options: F[k].opts.map(function (o) { return o[0]; }),\n        change: function (e) { var o = {}; o[k] = e.target.value; self.setState(o); } };\n    });\n    var kpis = [\n      { label: 'Headcount', value: fmt(hc), sub: 'Active employees', bg: '#DCE6F7' },\n      { label: 'Promoted', value: fmt(n(186, flow)), sub: 'In selected period', bg: '#D8EFE3' },\n      { label: 'New joiners', value: fmt(n(214, flow)), sub: 'In selected period', bg: '#D6EEF0' },\n      { label: 'Resignations', value: fmt(n(97, flow)), sub: 'Serving 90-day notice', bg: '#F6DADC' },\n      { label: 'On PIP / MT due', value: fmt(n(8, stock)) + ' / ' + fmt(n(12, stock)), sub: 'Reviews and confirmations in 15 days', bg: '#F3E1D3' },\n      { label: 'Bench', value: fmt(n(62, stock)), sub: fmt(n(19, stock)) + ' past 60 days \u2192 TSC pool', bg: '#F6E7C4' },\n      { label: 'Retiring in 8 months', value: fmt(n(6, stock)), sub: 'At age 58 \u00b7 plan successors', bg: '#E4E8EE' },\n      { label: 'TOS / ML completing', value: fmt(n(18, stock)) + ' / ' + fmt(n(9, stock)), sub: 'This month', bg: '#DDEBD5' },\n      { label: 'Training overdue', value: fmt(n(97, stock)), sub: 'Mostly Information Security', bg: '#F2E3C9' },\n all and project allocation.', bg: '#DDEBD5', fg: '#2E5E1F' },\n      { n: fmt(n(8, stock)), t: 'People on PIP: reviews due in 10 days', s: 'Check managers have logged weekly check-ins. MT confirmations: ' + fmt(n(12, stock)) + ' due in 15 days.', bg: '#E4E8EE', fg: '#2D3748' },\n      { n: fmt(n(31, stock)), t: 'Information Security training due 28 Nov', s: 'Send a reminder today.', bg: '#F2E3C9', fg: '#7A4A00' }\n    ];\n    var QA = {\n      promo25: { q: 'How many people were promoted in 2025?', n: n(241, stock), unit: 'people promoted in calendar year 2025',\n        text: 'That is ' + (241 / 1248 * 100).toFixed(1) + '% of headcount. E2 and F1 had the most promotions; 18 of those promoted have since resigned.',\n        h1: 'Grade', h2: 'Promoted in 2025', rows: [['D1', 21], ['D2', 30], ['E1', 44], ['E2', 53], ['F1', 57], ['F2', 36]] },\n      bench: { q: 'Who is completing 60 days on bench?', n: n(19, stock), unit: 'people past 60 days, now in the TSC pool',\n        text: n(7, stock) + ' more reach 60 days this week. 11 of the 19 have skills that match open project requests.',\n        h1: 'Bench aging', h2: 'People', rows: [['0\u201330 days', 24], ['31\u201359 days', 19], ['60\u201389 days', 13], ['90+ days', 6]] },\n      join: { q: 'How many people joined this month?', n: n(48, stock), unit: 'new joiners in November 2026',\n        text: '12 more are due before 30 Nov. 17 joiners have no project allocation yet.', h1: 'Business unit', h2: 'Joiners', rows: [['Application Services', 21], ['Digital Engineering', 13], ['Data & AI', 9], ['Foundation Services', 5]] },\n      resign: { q: 'How many resigned this month?', n: n(19, stock), unit: 'resignations in November 2026 (90-day notice)',\n        text: 'Last working days fall in February 2027. 4 scored 80+; 7 had no promotion in 30+ months.', h1: 'Reason given', h2: 'People', rows: [['Higher pay', 8], ['Career growth', 6], ['Relocation', 3], ['Higher studies', 2]] },\n      overdue: { q: 'Who should be reviewed
