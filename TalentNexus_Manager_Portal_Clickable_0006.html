<body>
<div id="bar"><strong>Talent Nexus · Manager portal · clickable prototype (sample data)</strong><div id="switch"><button data-s="Home2" onclick="show('Home2')">Team Dashboard</button><button data-s="Summary" onclick="show('Summary')">Summary</button><button data-s="Insights" onclick="show('Insights')">Insights</button><button data-s="Connect" onclick="show('Connect')">Team member profile</button><button data-s="Lists" onclick="show('Lists')">Team lists</button></div></div>
<div id="outer"><div id="wrap"><div id="stage"></div></div></div>
<script>var SCREENS = {"Home2": {"tpl": "\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#1F3F8F}\n</style>\n</helmet>\n<div style=\"width: 1440px; height: 900px; box-sizing: border-box; display: flex; font-family: Inter, system-ui, sans-serif; color: #1B2433; background: #F3F5F9\">\n\n<!-- Sidebar -->\n<nav aria-label=\"Manager portal\" style=\"width: 232px; flex-shrink: 0; background: #1F3F8F; color: #FFFFFF; display: flex; flex-direction: column; padding: 18px 12px; gap: 2px\">\n<div style=\"padding: 0 10px 16px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 20px; font-weight: 700\">Manager Portal</span>\n<span style=\"font-size: 12px; opacity: 0.8\">powered by Talent Nexus</span>\n</div>\n<template data-scfor=\"1\" list=\"{{menu}}\" as=\"m\" hint-placeholder-count=\"8\">\n<a href=\"{{m.href}}\" onClick=\"{{m.go}}\" style=\"min-height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 8px; background: {{m.bg}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: {{m.w}}\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{m.icon}}\"></path></svg>\n<span style=\"flex: 1\">{{m.label}}</span>\n<template data-scif=\"1\" value=\"{{m.hasBadge}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F2B705; color: #1B2433; font-size: 11px; font-weight: 700; text-align: center\">{{m.badge}}</span></template>\n</a>\n</template>\n<div style=\"margin-top: auto; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.1); font-size: 11px; line-height: 1.45; opacity: 0.9\">Your team only. Pay, attrition risk, talent-pool tags and HR cases stay with your People Partner.</div>\n</nav>\n\n<main style=\"flex: 1; min-width: 0; padding: 18px 26px; display: flex; flex-direction: column; gap: 14px\">\n<!-- Greeting + profile -->\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 700\">Good evening, Priya</h1>\n<span style=\"font-size: 13px; color: #5C6779\">Tuesday, 24 November 2026 \u00b7 25 direct reports \u00b7 60 in your whole team \u00b7 sample data</span>\n</div>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<button type=\"button\" aria-label=\"Notifications\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 1px solid #C5CDD9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F3F8F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"></path><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"></path></svg></button>\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #DCE6F7; color: #1F3F8F; display: flex; align-items: center; justify-content: center; font-weight: 700\">PN</div>\n</div>\n</div>\n\n<!-- Ask bar -->\n<section aria-label=\"Ask Talent Nexus\" style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; gap: 10px; align-items: center\">\n<span style=\"font-size: 18px; color: #6D3FD1\" aria-hidden=\"true\">\u2726</span>\n<label for=\"askbar\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden\">Ask Talent Nexus about your team</label>\n<input id=\"askbar\" type=\"text\" value=\"{{ask}}\" onChange=\"{{setAsk}}\" placeholder=\"Ask about your team, e.g. Who should I review for promotion?\" style=\"flex: 1; height: 46px; border: 1px solid #C5CDD9; border-radius: 8px; padding: 0 14px; font: inherit; font-size: 15px\">\n<button type=\"button\" onClick=\"{{doAsk}}\" style=\"height: 46px; padding: 0 20px; border: none; border-radius: 8px; background: #1F3F8F; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer\">Ask</button>\n</div>\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n<template data-scfor=\"1\" list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"5\">\n<button type=\"button\" onClick=\"{{c.pick}}\" style=\"min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #C5CDD9; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer\">{{c.q}}</button>\n</template>\n</div>\n<template data-scif=\"1\" value=\"{{hasAns}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background: #F3F0FD; border-radius: 8px; padding: 10px 14px; display: flex; gap: 14px; align-items: center\">\n<span style=\"font-size: 26px; font-weight: 700; color: #4C1D95\">{{ans.n}}</span>\n<span style=\"font-size: 13px; color: #2A3445; flex: 1\">{{ans.t}}</span>\n<a href=\"Insights.dc.html\" style=\"font-size: 13px; font-weight: 700; white-space: nowrap\">Open in Insights \u2192</a>\n</div>\n</template>\n</section>\n\n<!-- Snapshot -->\n<section aria-label=\"Team snapshot\" style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px\">\n<template data-scfor=\"1\" list=\"{{snap}}\" as=\"s\" hint-placeholder-count=\"5\">\n<a href=\"{{s.href}}\" style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #1B2433\">\n<span style=\"font-size: 12px; color: #5C6779; font-weight: 600\">{{s.l}}</span>\n<span style=\"font-size: 26px; font-weight: 700; color: {{s.c}}\">{{s.v}}</span>\n<span style=\"font-size: 12px; color: #3A4556\">{{s.d}}</span>\n</a>\n</template>\n</section>\n\n<div style=\"flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.25fr; gap: 14px\">\n<!-- To-dos -->\n<section style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 0\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\"><h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">To-do list</h2><span style=\"font-size: 12px; color: #5C6779\">{{doneCount}} of {{todoCount}} done</span></div>\n<div style=\"display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0\">\n<template data-scfor=\"1\" list=\"{{todos}}\" as=\"t\" hint-placeholder-count=\"7\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: {{t.bg}}\">\n<button type=\"button\" onClick=\"{{t.toggle}}\" aria-pressed=\"{{t.pressed}}\" aria-label=\"Mark done\" style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 6px; border: 2px solid {{t.box}}; background: {{t.fill}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0\">{{t.tick}}</button>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 1px; opacity: {{t.op}}\"><span style=\"font-size: 13px; font-weight: 600\">{{t.t}}</span><span style=\"font-size: 12px; color: #5C6779\">{{t.d}}</span></div>\n<span style=\"padding: 2px 8px; border-radius: 999px; background: {{t.tagBg}}; color: {{t.tagFg}}; font-size: 11px; font-weight: 700; white-space: nowrap\">{{t.due}}</span>\n</div>\n</template>\n</div>\n</section>\n\n<!-- Team cards -->\n<section style=\"background: #FFFFFF; border: 1px solid #DDE3EC; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<h2 style=\"margin: 0; font-size: 16px; font-weight: 700\">My team</h2>\n<div role=\"group\" aria-label=\"Filter team\" style=\"display: flex; gap: 4px\">\n<template data-scfor=\"1\" list=\"{{tf}}\" as=\"f\" hint-placeholder-count=\"4\"><button type=\"button\" onClick=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\" style=\"height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer\">{{f.l}}</button></template>\n</div>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; overflow-y: auto; min-height: 0\">\n<template data-scfor=\"1\" list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"12\">\n<a href=\"Connect.dc.html\" style=\"border: 1px solid #DDE3EC; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #1B2433\">\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<span style=\"width: 34px; height: 34px; border-radius: 50%; background: #DCE6F7; color: #1F3F8F; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0\">{{p.ini}}</span>\n<div style=\"display: flex; flex-direction: column; min-width: 0\"><span style=\"font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{p.name}}</span><span style=\"font-size: 11px; color: #5C6779\">{{p.role}} \u00b7 {{p.grade}}</span></div>\n</div>\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"font-size: 11px; color: #5C6779\">Score <strong style=\"color: #1B2433; font-size: 13px\">{{p.score}}</strong></span>\n<span style=\"padding: 2px 8px; border-radius: 999px; background: {{p.tagBg}}; color: {{p.tagFg}}; font-size: 10px; font-weight: 700\">{{p.tag}}</span>\n</div>\n</a>\n</template>\n</div>\n<a href=\"Connect.dc.html\" style=\"font-size: 13px; font-weight: 700; align-self: flex-end\">View all 25 \u2192</a>\n</section>\n</div>\n</main>\n</div>\n", "code": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { ask: '', ans: null, done: {}, tf: 'all' };\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    var I = {\n      home: 'M3 11l9-7 9 7 M5 10v10h14V10', team: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16 4.5a3.5 3.5 0 0 1 0 7',\n      spark: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z', prof: 'M4 4h16v16H4z M9 10a2 2 0 1 0 4 0 2 2 0 0 0-4 0 M7 17c.6-2 2-3 4-3s3.4 1 4 3',\n      notes: 'M6 3h9l3 3v15H6z M9 9h6 M9 13h6', promo: 'M12 20V5 M6 11l6-6 6 6', curve: 'M3 20h18 M4 19c3 0 4-12 8-12s5 12 8 12',\n      exit: 'M14 4h5v16h-5 M10 16l4-4-4-4 M14 12H4', away: 'M8 3v4 M16 3v4 M4 8h16v12H4z', train: 'M3 8l9-4 9 4-9 4z M7 10v5c2 2 8 2 10 0v-5',\n      award: 'M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12z M8.5 14L7 21l5-3 5 3-1.5-7'\n    };\n    var M = [['Team Dashboard', I.team, '#', '', true], ['Summary', I.prof, 'Summary.dc.html', ''], ['Insights', I.spark, 'Insights.dc.html', '6'], ['Team Profiles', I.prof, 'Connect.dc.html', ''],\n      ['New Joiners', I.team, 'Lists.dc.html', '3', false, 'joiners'], ['Resignations', I.exit, 'Lists.dc.html', '2', false, 'resign'],\n      ['Training', I.train, 'Lists.dc.html', '8', false, 'training'], ['Awards', I.award, 'Lists.dc.html', '', false, 'awards']];\n    var menu = M.map(function (m) { return { label: m[0], icon: m[1], href: m[2], badge: m[3], hasBadge: !!m[3], bg: m[4] ? 'rgba(255,255,255,0.18)' : 'transparent', w: m[4] ? '700' : '500',\n      go: function () { if (m[5]) { try { window.sessionStorage.setItem('tnTab', m[5]); } catch (e) {} } } }; });\n    var QA = [\n      ['Who should I review for promotion?', '7', '7 people have 30+ months in grade and a score of 80+. Sneha (94) scores highest; Rahul has waited longest (34 months).'],\n      ['Who joined my team this month?', '3', 'Aarav, Ishita and Nisha joined in November. 2 still need a buddy assigned.'],\n      ['Who has training pending?', '8', 'Information Security is due 28 Nov for 6 people; 2 have POSH refresher pending.'],\n      ['Whose scores dropped?', '3', 'Farhan 70 \u2192 64, Arjun 78 \u2192 75, Karthik 83 \u2192 81. Read their previous managers\u2019 comments.'],\n      ['Award winners Q1 FY26?', '4', 'Sneha and Kavya (Star Performer), Rahul (Client appreciation), Vishal (Spot award).']\n    ];\n    var chips = QA.map(function (q, i) { return { q: q[0], pick: function () { self.setState({ ask: q[0], ans: i }); } }; });\n    var doAsk = function () {\n      var t = (self.state.ask || '').toLowerCase();\n      var i = t.indexOf('join') > -1 ? 1 : t.indexOf('train') > -1 ? 2 : t.indexOf('drop') > -1 ? 3 : t.indexOf('award') > -1 ? 4 : 0;\n      self.setState({ ans: i });\n    };\n    var snap = [\n      { l: 'Team size', v: '25', d: '60 incl. sub-teams', c: '#1B2433', href: 'Summary.dc.html' },\n      { l: 'Review for promotion', v: '7', d: '30+ months, score 80+', c: '#1E6B34', href: 'Summary.dc.html' },\n      { l: 'PIP / MT confirmations', v: '1 / 2', d: 'Due in the next 15 days', c: '#B42318', href: 'Connect.dc.html' },\n      { l: 'New joiners', v: '3', d: 'Joined this month', c: '#1F3F8F', href: 'Connect.dc.html' },\n      { l: 'Training pending', v: '8', d: 'InfoSec due 28 Nov', c: '#B42318', href: '#' }\n    ];\n    var T = [\n      ['Varun Iyer is on PIP: mid-review due', 'Review meeting 04 Dec \u00b7 weekly check-ins', 'In 10 days', 'red'],\n      ['Ritika Das: MT confirmation due', 'Send your feedback by 01 Dec', 'In 10 days', 'warn'],\n      ['Neha Sharma: MT confirmation due', 'Send your feedback by 04 Dec', 'In 15 days', 'warn'],\n      ['Remind 8 people about Information Security training', 'Send one reminder from here', 'Today', 'red'],\n      ['Assign a buddy to 2 new joiners', 'Aarav and Nisha joined this month', 'This week', 'blue'],\n      ['Handover plan for Farhan (resigned)', 'Regression suite to Neha by 31 Jan', 'This week', 'blue'],\n      ['1:1 with Rahul on Tech Lead path', 'Previous manager rated him ready', 'Fri', 'green']\n    ];\n    var tagc = { warn: ['#FFF4E0', '#7A4A00'], red: ['#FDECEA', '#9B1C1C'], blue: ['#DCE6F7', '#1F3F8F'], green: ['#D8EFE3', '#1E6B34'] };\n    var doneCount = 0;\n    var todos = T.map(function (t, i) {\n      var d = !!st.done[i]; if (d) doneCount++;\n      return { t: t[0], d: t[1], due: t[2], tagBg: tagc[t[3]][0], tagFg: tagc[t[3]][1], pressed: d ? 'true' : 'false', tick: d ? '\u2713' : '',\n        box: d ? '#1E6B34' : '#8A96A8', fill: d ? '#1E6B34' : '#FFFFFF', bg: d ? '#F3F5F9' : '#FFFFFF', op: d ? '0.55' : '1',\n        toggle: function () { var x = Object.assign({}, self.state.done); x[i] = !x[i]; self.setState({ done: x }); } };\n    });\n    var P = [\n      ['Sneha Kulkarni', 'SK', 'Data Scientist', 'D2', 94, 'Review for promotion', 'due'], ['Rahul Menon', 'RM', 'Sr Software Engineer', 'E2', 76, 'Review for promotion', 'due'],\n      ['Karthik Rao', 'KR', 'Technical Lead', 'D1', 81, 'On track', 'ok'], ['Pooja Iyer', 'PI', 'Business Analyst', 'E2', 77, 'On track', 'ok'],\n      ['Arjun Nambiar', 'AN', 'DevOps Engineer', 'E1', 75, 'On track', 'ok'], ['Neha Sharma', 'NS', 'Software Engineer', 'F1', 72, 'MT confirm in 15 days', 'mt'],\n      ['Ritika Das', 'RD', 'Software Engineer', 'F1', 70, 'MT confirm in 10 days', 'mt'], ['Farhan Ali', 'FA', 'QA Engineer', 'F1', 64, 'Resigned \u00b7 LWD 08 Feb', 'exit'],\n      ['Kavya Reddy', 'KY', 'Software Engineer', 'E1', 91, 'Star Performer', 'ok'], ['Aarav Patel', 'AP', 'Software Engineer', 'F2', '\u2014', 'Joined Nov 2026', 'new'],\n      ['Meera Pillai', 'MP', 'Solution Consultant', 'D2', 83, 'On track', 'ok'], ['Varun Iyer', 'VI', 'Software Engineer', 'F2', 57, 'On PIP \u00b7 review in 10 days', 'pip']\n    ];\n    var TG = { pip: ['#FDECEA', '#9B1C1C'], mt: ['#FFF4E0', '#7A4A00'], due: ['#D8E
